version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ledger-db
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger-app:
    build: .
    container_name: ledger-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ledger_db
      - SPRING_DATASOURCE_USERNAME=ledger_user
      - SPRING_DATASOURCE_PASSWORD=ledger_password
      # Ensures Flyway runs on startup
      - SPRING_FLYWAY_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: